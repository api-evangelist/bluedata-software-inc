description: BlueData Software Inc was a big-data infrastructure company whose EPIC platform ran
  Hadoop, Spark, and other analytics workloads in Docker containers on-premises and in the cloud.
  It was a dcvc (Data Collective) portfolio company and was acquired by Hewlett Packard Enterprise
  (HPE) in 2018; its technology now lives on as the HPE Ezmeral Container Platform. The original
  www.bluedata.com domain 301-redirects to HPE's container-platform page, and the company no longer
  operates an independent developer, API, or documentation surface, so there is nothing for the
  enrichment pipeline to harvest without fabrication. This profile is retained as an acquired-company
  lead.
